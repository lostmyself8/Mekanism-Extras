name: Sync Github Folder

on:
  push:
    branches: ['1.20.1']
    paths: ['.github/**']

jobs:
  sync-1-21:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '1.21.1'
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C gh/workflow-sync-1-21
          git fetch origin
          git checkout origin/1.20.1 -- .github
          git commit -am "Sync Workflows from 1.20.1"
          git push --force --set-upstream origin gh/workflow-sync-1-21
          gh pr create -B 1.21.1 -H gh/workflow-sync-1-21 --title "Sync Workflows with 1.20.1 [no-snapshot]" --body "Created by GH Workflow" --label "ignore changelog"

  sync-1-19:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '1.19.2'
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C gh/workflow-sync-1-19
          git fetch origin
          git checkout origin/1.20.1 -- .github
          git commit -am "Sync Workflows from 1.20.1"
          git push --force --set-upstream origin gh/workflow-sync-1-19
          gh pr create -B 1.19.2 -H gh/workflow-sync-1-19 --title "Sync Workflows with 1.20.1 [no-snapshot]" --body "Created by GH Workflow" --label "ignore changelog"